services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hkgpipi
      POSTGRES_PASSWORD: hkgpipi
      POSTGRES_DB: hkgpipi
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hkgpipi']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: ghcr.io/axllent/mailpit:latest
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    profiles: ['storage']
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: hkgpipi-local
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['objects:/data']
  clamav:
    image: mirror.gcr.io/clamav/clamav:stable
    profiles: ['scanning']
    ports: ['127.0.0.1:3310:3310']
volumes:
  postgres:
  objects:
